<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa de Mauá</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
    background:#ffe4f2;
    font-family:Arial,sans-serif;
    padding:20px;
}

h1{
    color:#d63384;
    text-align:center;
}

.voltar{
    display:inline-block;
    background:#ff69b4;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

.voltar:hover{
    background:#d63384;
}

#map{
    height:650px;
    margin-top:20px;
    border:5px solid hotpink;
    border-radius:15px;
}

</style>

</head>

<body>

<h1>🗺️ Mapa de Mauá</h1>

<a href="index.html" class="voltar">⬅ Voltar ao Menu</a>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Cria o mapa
const map = L.map('map').setView([-23.667,-46.461],13);

// Camada base
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom:19,
    attribution:'© OpenStreetMap'
}
).addTo(map);

// ETEC Mauá
L.marker([-23.668,-46.457])
.addTo(map)
.bindPopup('<b>ETEC Mauá</b>');

// FATEC Mauá
L.marker([-23.668,-46.456])
.addTo(map)
.bindPopup('<b>FATEC Mauá</b>');

// Prefeitura de Mauá
L.marker([-23.670,-46.462])
.addTo(map)
.bindPopup('<b>Prefeitura de Mauá</b>');

// Meu Trabalho
L.marker([-23.665,-46.455])
.addTo(map)
.bindPopup('<b>Meu Trabalho</b>');

// Contorno do município
fetch('maua.geojson')
.then(response => response.json())
.then(data => {

    const limiteMunicipio = L.geoJSON(data,{
        style:{
            color:'#d63384',
            weight:4,
            fillColor:'#ff69b4',
            fillOpacity:0.20
        }
    }).addTo(map);

    // Ajusta o zoom ao contorno
    map.fitBounds(limiteMunicipio.getBounds());

})
.catch(error=>{
    console.log('Erro ao carregar maua.geojson', error);
});

</script>

</body>
</html>
